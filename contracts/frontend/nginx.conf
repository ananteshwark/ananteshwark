# Integration addition (not from CMS upstream). Serves the built SPA with a
# client-side-routing fallback. /api is NOT proxied here — Caddy routes /api/*
# to the contracts backend at the edge (see ../../docker/contracts/contracts.caddy).
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }
}
