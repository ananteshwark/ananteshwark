services:
  postgres:
    image: postgres:16-alpine
    container_name: erp_postgres
    environment:
      POSTGRES_DB: erp_db
      POSTGRES_USER: erp_user
      POSTGRES_PASSWORD: erp_password
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres:/docker-entrypoint-initdb.d
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U erp_user -d erp_db']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: erp_redis
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: erp_api
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - '3000:3000'
    environment:
      APP_PORT: 3000
      APP_ENV: development
      APP_VERSION: 1.0.0
      DATABASE_URL: postgresql://erp_user:erp_password@postgres:5432/erp_db
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_USER: erp_user
      DATABASE_PASSWORD: erp_password
      DATABASE_NAME: erp_db
      REDIS_URL: redis://redis:6379
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: dev-jwt-secret-change-in-production
      JWT_REFRESH_SECRET: dev-refresh-secret-change-in-production
      JWT_EXPIRATION: 15m
      JWT_REFRESH_EXPIRATION: 7d
      ALLOWED_ORIGINS: http://localhost:5173,http://localhost:3000
    # Seed demo data (idempotent) on startup, then launch the API.
    command: sh -c "node dist/database/seed.js || echo 'Seeding skipped'; node dist/main.js"

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    container_name: erp_web
    depends_on:
      - api
    ports:
      - '5173:80'

volumes:
  postgres_data:
