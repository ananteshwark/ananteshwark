version: "3.9"

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: cms
      POSTGRES_PASSWORD: cms
      POSTGRES_DB: cms
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg2://cms:cms@db:5432/cms
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      WATCH_ROOT: /watched
      EMAIL_DRY_RUN: "true"
    volumes:
      - ./watched:/watched
    ports:
      - "8000:8000"
    depends_on:
      - db

volumes:
  pgdata:
